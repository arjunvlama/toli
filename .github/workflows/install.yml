name: Install

# Builds a snapshot release and installs it with install.sh / install.ps1 on
# each OS, as a user would, but from a local server instead of GitHub
# Releases (so it works before a release exists). The Release workflow does
# the same against the real release.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - .goreleaser.yaml
      - cmd/**
      - .github/scripts/**
      - .github/workflows/install.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .goreleaser.yaml
      - cmd/**
      - .github/scripts/**
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
        env:
          HOMEBREW_TAP_TOKEN: unused # a snapshot doesn't publish the cask
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8765/checksums.txt && break; sleep 0.5; done
          TOLI_DOWNLOAD_URL=http://127.0.0.1:8765 sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", "dist" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8765/checksums.txt -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
          }
          $env:TOLI_DOWNLOAD_URL = "http://127.0.0.1:8765"
          ./install.ps1
          "$env:LOCALAPPDATA\Programs\toli" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: toli works
        if: runner.os != 'Windows'
        run: sh .github/scripts/smoke.sh
      - name: toli works
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/smoke.ps1
