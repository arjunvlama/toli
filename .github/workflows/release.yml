name: Release

# Pushing a tag like v0.1.0 builds every platform, publishes a GitHub release
# with the archives and checksums, and updates the Homebrew cask.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Install the release exactly as the README says, on each OS, and check
  # toli works.
  check-install:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/arjunvlama/toli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/arjunvlama/toli/main/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\toli" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: toli works
        if: runner.os != 'Windows'
        run: sh .github/scripts/smoke.sh
      - name: toli works
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/smoke.ps1

  check-brew:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install arjunvlama/tap/toli
      - name: toli works
        run: sh .github/scripts/smoke.sh
